<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生产线VSM图 - 价值流分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 30px;
            text-align: center;
            cursor: pointer;
        }
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            outline: none;
        }
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
            outline: none;
        }
        .svg-container {
            padding: 20px;
            background: #f8f9fa;
            overflow-x: auto;
            position: relative;
        }
        .svg-container svg {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
        }
        .svg-container svg text {
            cursor: pointer;
            transition: filter 0.2s;
        }
        .svg-container svg text:hover {
            filter: brightness(1.2) drop-shadow(0 0 3px rgba(52,152,219,0.6));
        }
        .svg-container svg text.editing-hint {
            fill: #3498db !important;
            text-decoration: underline;
        }
        .footer {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 0.9em;
        }
        .footer a {
            color: #3498db;
            text-decoration: none;
        }

        /* 双击提示 */
        .edit-tip {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(44, 62, 80, 0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 13px;
            z-index: 1000;
            animation: fadeInOut 5s ease-in-out forwards;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(20px); }
        }

        /* 行内编辑框 */
        .inline-editor {
            position: absolute;
            z-index: 100;
            background: white;
            border: 2px solid #3498db;
            border-radius: 4px;
            padding: 4px 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .inline-editor input {
            border: none;
            outline: none;
            font-size: 14px;
            min-width: 100px;
            background: transparent;
        }
        .editor-tip {
            font-size: 10px;
            color: #95a5a6;
            margin-top: 4px;
            text-align: center;
        }

        /* 工具栏 */
        .toolbar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 999;
        }
        .tool-btn {
            background: white;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: all 0.2s;
        }
        .tool-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
        .tool-btn.reset {
            color: #e74c3c;
        }
        .tool-btn.export {
            color: #27ae60;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }
            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button class="tool-btn reset" onclick="resetAll()">↺ 重置</button>
        <button class="tool-btn export" onclick="exportConfig()">⬇ 导出</button>
    </div>

    <div class="edit-tip" id="editTip">💡 双击任意文字即可直接编辑</div>

    <div class="container">
        <div class="header">
            <h1 id="pageTitle" class="editable" data-key="pageTitle">生产线价值流图 (VSM)</h1>
            <p id="pageSubtitle" class="editable" data-key="pageSubtitle">电子产品组装生产线 - 价值流分析</p>
        </div>
        <div class="svg-container" id="svgContainer">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" id="vsmSvg">
                <rect width="1200" height="600" fill="#f8f9fa"/>

                <text id="svgTitle" class="editable" data-key="svgTitle" x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50" text-anchor="middle">生产线价值流图 (VSM) 示例</text>
                <text id="productFamily" class="editable" data-key="productFamily" x="600" y="65" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d" text-anchor="middle">产品族: 电子产品组装</text>

                <!-- 供应商 -->
                <g transform="translate(50, 150)">
                    <rect x="0" y="0" width="80" height="60" fill="#3498db" rx="5"/>
                    <text id="supplierLine1" class="editable" data-key="supplierLine1" x="40" y="25" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">原材料</text>
                    <text id="supplierLine2" class="editable" data-key="supplierLine2" x="40" y="40" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">供应商</text>
                    <text id="supplierLeadTime" class="editable" data-key="supplierLeadTime" x="40" y="80" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">交付周期: 5天</text>
                </g>

                <!-- 供应商到仓库 -->
                <path d="M 130 180 L 180 180" stroke="#27ae60" stroke-width="3" fill="none"/>
                <polygon points="175,175 185,180 175,185" fill="#27ae60"/>
                <text x="155" y="170" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">物料流</text>

                <!-- 原材料仓库 -->
                <g transform="translate(180, 150)">
                    <polygon points="60,0 120,0 120,60 60,60 0,30" fill="#f39c12"/>
                    <text id="rawWarehouseLine1" class="editable" data-key="rawWarehouseLine1" x="60" y="25" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">原材料</text>
                    <text id="rawWarehouseLine2" class="editable" data-key="rawWarehouseLine2" x="60" y="38" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">库存</text>
                    <text id="rawInventory" class="editable" data-key="rawInventory" x="60" y="80" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" text-anchor="middle">库存: 5000件</text>
                </g>

                <!-- 仓库到冲压 -->
                <path d="M 300 180 L 360 180" stroke="#27ae60" stroke-width="3" fill="none"/>
                <polygon points="355,175 365,180 355,185" fill="#27ae60"/>
                <text x="330" y="170" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">运输</text>
                <text id="rawTransportTime" class="editable" data-key="rawTransportTime" x="330" y="195" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">1天</text>

                <!-- 冲压工序 -->
                <g transform="translate(360, 130)">
                    <rect x="0" y="0" width="120" height="100" fill="#3498db" rx="5"/>
                    <text id="process1Name" class="editable" data-key="process1Name" x="60" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">冲压</text>
                    <line x1="10" y1="30" x2="110" y2="30" stroke="white" stroke-width="1" opacity="0.5"/>
                    <text id="process1CT" class="editable" data-key="process1CT" x="60" y="48" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">C/T: 2秒</text>
                    <text id="process1CO" class="editable" data-key="process1CO" x="60" y="62" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">C/O: 15分钟</text>
                    <text id="process1Available" class="editable" data-key="process1Available" x="60" y="76" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">可用: 7.5h/天</text>
                    <text id="process1OEE" class="editable" data-key="process1OEE" x="60" y="90" font-family="Arial, sans-serif" font-size="10" fill="#ffcc00" text-anchor="middle">OEE: 85%</text>
                </g>

                <!-- 冲压到焊接 -->
                <path d="M 480 180 L 540 180" stroke="#27ae60" stroke-width="3" fill="none"/>
                <polygon points="535,175 545,180 535,185" fill="#27ae60"/>
                <text x="510" y="170" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">在制品运输</text>
                <text id="process1Transport" class="editable" data-key="process1Transport" x="510" y="195" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">2小时</text>

                <!-- 焊接工序 -->
                <g transform="translate(540, 130)">
                    <rect x="0" y="0" width="120" height="100" fill="#3498db" rx="5"/>
                    <text id="process2Name" class="editable" data-key="process2Name" x="60" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">焊接</text>
                    <line x1="10" y1="30" x2="110" y2="30" stroke="white" stroke-width="1" opacity="0.5"/>
                    <text id="process2CT" class="editable" data-key="process2CT" x="60" y="48" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">C/T: 5秒</text>
                    <text id="process2CO" class="editable" data-key="process2CO" x="60" y="62" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">C/O: 10分钟</text>
                    <text id="process2Available" class="editable" data-key="process2Available" x="60" y="76" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">可用: 7.5h/天</text>
                    <text id="process2OEE" class="editable" data-key="process2OEE" x="60" y="90" font-family="Arial, sans-serif" font-size="10" fill="#ffcc00" text-anchor="middle">OEE: 78%</text>
                </g>

                <!-- 焊接到组装 -->
                <path d="M 660 180 L 720 180" stroke="#27ae60" stroke-width="3" fill="none"/>
                <polygon points="715,175 725,180 715,185" fill="#27ae60"/>
                <text x="690" y="170" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">在制品运输</text>
                <text id="process2Transport" class="editable" data-key="process2Transport" x="690" y="195" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">30分钟</text>

                <!-- 组装工序 -->
                <g transform="translate(720, 130)">
                    <rect x="0" y="0" width="120" height="100" fill="#3498db" rx="5"/>
                    <text id="process3Name" class="editable" data-key="process3Name" x="60" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">组装</text>
                    <line x1="10" y1="30" x2="110" y2="30" stroke="white" stroke-width="1" opacity="0.5"/>
                    <text id="process3CT" class="editable" data-key="process3CT" x="60" y="48" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">C/T: 8秒</text>
                    <text id="process3CO" class="editable" data-key="process3CO" x="60" y="62" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">C/O: 20分钟</text>
                    <text id="process3Available" class="editable" data-key="process3Available" x="60" y="76" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">可用: 7.5h/天</text>
                    <text id="process3OEE" class="editable" data-key="process3OEE" x="60" y="90" font-family="Arial, sans-serif" font-size="10" fill="#ffcc00" text-anchor="middle">OEE: 82%</text>
                </g>

                <!-- 组装到成品 -->
                <path d="M 840 180 L 900 180" stroke="#27ae60" stroke-width="3" fill="none"/>
                <polygon points="895,175 905,180 895,185" fill="#27ae60"/>
                <text x="870" y="170" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">成品运输</text>
                <text id="process3Transport" class="editable" data-key="process3Transport" x="870" y="195" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">1天</text>

                <!-- 成品仓库 -->
                <g transform="translate(900, 150)">
                    <polygon points="60,0 120,0 120,60 60,60 0,30" fill="#f39c12"/>
                    <text id="fgWarehouseLine1" class="editable" data-key="fgWarehouseLine1" x="60" y="25" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">成品</text>
                    <text id="fgWarehouseLine2" class="editable" data-key="fgWarehouseLine2" x="60" y="38" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">库存</text>
                    <text id="fgInventory" class="editable" data-key="fgInventory" x="60" y="80" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" text-anchor="middle">库存: 2000件</text>
                </g>

                <!-- 成品到客户 -->
                <path d="M 1020 180 L 1080 180" stroke="#27ae60" stroke-width="3" fill="none"/>
                <polygon points="1075,175 1085,180 1075,185" fill="#27ae60"/>
                <text x="1050" y="170" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">成品流</text>

                <!-- 客户 -->
                <g transform="translate(1080, 150)">
                    <rect x="0" y="0" width="80" height="60" fill="#e74c3c" rx="5"/>
                    <text id="customerLine1" class="editable" data-key="customerLine1" x="40" y="25" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">终端</text>
                    <text id="customerLine2" class="editable" data-key="customerLine2" x="40" y="40" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">客户</text>
                    <text id="customerDemand" class="editable" data-key="customerDemand" x="40" y="80" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">需求: 800/天</text>
                </g>

                <!-- 信息流 -->
                <path d="M 1080 250 L 900 250 L 900 290" stroke="#9b59b6" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
                <polygon points="900,285 895,295 905,295" fill="#9b59b6"/>
                <text x="990" y="245" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">客户订单</text>

                <path d="M 900 290 L 720 290 L 720 250" stroke="#9b59b6" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
                <polygon points="720,245 715,255 725,255" fill="#9b59b6"/>
                <text x="810" y="285" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">生产计划</text>

                <path d="M 720 250 L 540 250 L 540 290" stroke="#9b59b6" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
                <polygon points="540,285 535,295 545,295" fill="#9b59b6"/>
                <text x="630" y="245" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">生产指令</text>

                <path d="M 540 290 L 360 290 L 360 250" stroke="#9b59b6" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
                <polygon points="360,245 355,255 365,255" fill="#9b59b6"/>
                <text x="450" y="285" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">采购订单</text>

                <path d="M 360 250 L 180 250 L 180 220" stroke="#9b59b6" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
                <polygon points="180,215 175,225 185,225" fill="#9b59b6"/>
                <text x="270" y="245" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">交付计划</text>

                <!-- 时间线 -->
                <g transform="translate(360, 320)">
                    <line x1="0" y1="0" x2="540" y2="0" stroke="#2c3e50" stroke-width="2"/>
                    <line x1="60" y1="-10" x2="60" y2="10" stroke="#27ae60" stroke-width="2"/>
                    <text x="60" y="25" font-family="Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">0</text>
                    <line x1="180" y1="-10" x2="180" y2="10" stroke="#27ae60" stroke-width="2"/>
                    <text x="180" y="25" font-family="Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">2秒</text>
                    <line x1="300" y1="-10" x2="300" y2="10" stroke="#27ae60" stroke-width="2"/>
                    <text x="300" y="25" font-family="Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">增值时间</text>
                    <line x1="540" y1="-10" x2="540" y2="10" stroke="#27ae60" stroke-width="2"/>
                    <text x="540" y="25" font-family="Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">总计</text>
                    <text x="270" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="middle">增值时间: 15秒 / 总交付周期: 约9.5天</text>
                </g>

                <!-- 在制品库存 -->
                <g transform="translate(420, 260)">
                    <polygon points="20,0 40,0 40,25 20,25 0,12.5" fill="#95a5a6"/>
                    <text id="process1WIP" class="editable" data-key="process1WIP" x="20" y="40" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d" text-anchor="middle">1200件</text>
                </g>
                <g transform="translate(600, 260)">
                    <polygon points="20,0 40,0 40,25 20,25 0,12.5" fill="#95a5a6"/>
                    <text id="process2WIP" class="editable" data-key="process2WIP" x="20" y="40" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d" text-anchor="middle">800件</text>
                </g>
                <g transform="translate(780, 260)">
                    <polygon points="20,0 40,0 40,25 20,25 0,12.5" fill="#95a5a6"/>
                    <text id="process3WIP" class="editable" data-key="process3WIP" x="20" y="40" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d" text-anchor="middle">500件</text>
                </g>

                <!-- 图例 -->
                <g transform="translate(50, 400)">
                    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">图例 Legend</text>
                    <rect x="0" y="15" width="40" height="25" fill="#3498db" rx="3"/>
                    <text x="50" y="32" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">工序 Process</text>
                    <polygon points="140,27 160,27 160,52 140,52 130,39.5" fill="#f39c12"/>
                    <text x="170" y="39" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">库存 Inventory</text>
                    <line x1="240" y1="39" x2="280" y2="39" stroke="#27ae60" stroke-width="3"/>
                    <polygon points="275,34 285,39 275,44" fill="#27ae60"/>
                    <text x="295" y="43" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">物料流 Material Flow</text>
                    <line x1="420" y1="39" x2="460" y2="39" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,3"/>
                    <text x="470" y="43" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">信息流 Information Flow</text>
                </g>

                <!-- KPI指标 -->
                <g transform="translate(50, 480)">
                    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">关键指标 KPIs</text>
                    <rect x="0" y="15" width="200" height="60" fill="white" stroke="#bdc3c7" rx="5"/>
                    <text x="15" y="35" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">增值时间 Value-add Time:</text>
                    <text id="kpiValueAdd" class="editable" data-key="kpiValueAdd" x="15" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">15秒</text>
                    <text x="70" y="55" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">(0.004% of Lead Time)</text>

                    <rect x="220" y="15" width="200" height="60" fill="white" stroke="#bdc3c7" rx="5"/>
                    <text x="235" y="35" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">生产前置时间 Lead Time:</text>
                    <text id="kpiLeadTime" class="editable" data-key="kpiLeadTime" x="235" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">约9.5天</text>

                    <rect x="440" y="15" width="200" height="60" fill="white" stroke="#bdc3c7" rx="5"/>
                    <text x="455" y="35" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">增值时间比:</text>
                    <text id="kpiValueRatio" class="editable" data-key="kpiValueRatio" x="455" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">0.004%</text>

                    <rect x="660" y="15" width="200" height="60" fill="white" stroke="#bdc3c7" rx="5"/>
                    <text x="675" y="35" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">库存周转 Inventory:</text>
                    <text id="kpiTotalInventory" class="editable" data-key="kpiTotalInventory" x="675" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">8500件</text>
                </g>

                <!-- 改善机会 -->
                <g transform="translate(880, 480)">
                    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">改善机会 Improvement Opportunities</text>
                    <text id="improve1" class="editable" data-key="improve1" x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• 减少焊接工序换模时间</text>
                    <text id="improve2" class="editable" data-key="improve2" x="0" y="36" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• 降低在制品库存</text>
                    <text id="improve3" class="editable" data-key="improve3" x="0" y="52" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• 实施拉动系统</text>
                </g>

                <!-- 节拍时间 -->
                <g transform="translate(880, 280)">
                    <rect x="0" y="0" width="100" height="50" fill="#2ecc71" rx="5"/>
                    <text x="50" y="20" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">客户需求节拍</text>
                    <text id="kpiTaktTime" class="editable" data-key="kpiTaktTime" x="50" y="38" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">T/T = 10.8秒</text>
                </g>

            </svg>
        </div>
        <div class="footer">
            <p>生产线VSM价值流图 | 精益生产工具</p>
        </div>
    </div>

    <script>
        const defaultConfig = {
            pageTitle: "生产线价值流图 (VSM)",
            pageSubtitle: "电子产品组装生产线 - 价值流分析",
            svgTitle: "生产线价值流图 (VSM) 示例",
            productFamily: "产品族: 电子产品组装",
            supplierLine1: "原材料",
            supplierLine2: "供应商",
            supplierLeadTime: "交付周期: 5天",
            rawWarehouseLine1: "原材料",
            rawWarehouseLine2: "库存",
            rawInventory: "库存: 5000件",
            rawTransportTime: "1天",
            process1Name: "冲压",
            process1CT: "C/T: 2秒",
            process1CO: "C/O: 15分钟",
            process1Available: "可用: 7.5h/天",
            process1OEE: "OEE: 85%",
            process1Transport: "2小时",
            process1WIP: "1200件",
            process2Name: "焊接",
            process2CT: "C/T: 5秒",
            process2CO: "C/O: 10分钟",
            process2Available: "可用: 7.5h/天",
            process2OEE: "OEE: 78%",
            process2Transport: "30分钟",
            process2WIP: "800件",
            process3Name: "组装",
            process3CT: "C/T: 8秒",
            process3CO: "C/O: 20分钟",
            process3Available: "可用: 7.5h/天",
            process3OEE: "OEE: 82%",
            process3Transport: "1天",
            process3WIP: "500件",
            fgWarehouseLine1: "成品",
            fgWarehouseLine2: "库存",
            fgInventory: "库存: 2000件",
            customerLine1: "终端",
            customerLine2: "客户",
            customerDemand: "需求: 800/天",
            kpiValueAdd: "15秒",
            kpiLeadTime: "约9.5天",
            kpiValueRatio: "0.004%",
            kpiTotalInventory: "8500件",
            kpiTaktTime: "T/T = 10.8秒",
            improve1: "• 减少焊接工序换模时间",
            improve2: "• 降低在制品库存",
            improve3: "• 实施拉动系统"
        };

        let currentConfig = {...defaultConfig};
        let currentEditor = null;

        function init() {
            const saved = localStorage.getItem('vsmConfig');
            if (saved) {
                currentConfig = {...defaultConfig, ...JSON.parse(saved)};
                applyConfig();
            }
            setupDoubleClickEdit();
            setTimeout(() => {
                const tip = document.getElementById('editTip');
                if (tip) tip.style.display = 'none';
            }, 5000);
        }

        function applyConfig() {
            for (const key in currentConfig) {
                const el = document.getElementById(key);
                if (el) {
                    el.textContent = currentConfig[key];
                }
            }
        }

        function setupDoubleClickEdit() {
            const editables = document.querySelectorAll('.editable');
            editables.forEach(el => {
                el.addEventListener('dblclick', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    startEdit(el);
                });
                el.style.cursor = 'text';
            });
        }

        function startEdit(element) {
            if (currentEditor) return;

            const key = element.dataset.key;
            const originalText = element.textContent;
            const isSvgText = element.tagName.toLowerCase() === 'text';

            let inputDiv, input;

            if (isSvgText) {
                const svg = document.getElementById('vsmSvg');
                const container = document.getElementById('svgContainer');
                const rect = element.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();

                inputDiv = document.createElement('div');
                inputDiv.className = 'inline-editor';
                inputDiv.style.left = (rect.left - containerRect.left + container.scrollLeft - 5) + 'px';
                inputDiv.style.top = (rect.top - containerRect.top + container.scrollTop - 3) + 'px';
                inputDiv.style.minWidth = (rect.width + 10) + 'px';

                input = document.createElement('input');
                input.type = 'text';
                input.value = originalText;
                input.style.fontSize = (parseFloat(window.getComputedStyle(element).fontSize) || 14) + 'px';
                input.style.width = Math.max(rect.width + 10, 80) + 'px';

                const tip = document.createElement('div');
                tip.className = 'editor-tip';
                tip.textContent = 'Enter确认 · Esc取消';

                inputDiv.appendChild(input);
                inputDiv.appendChild(tip);
                container.appendChild(inputDiv);
            } else {
                inputDiv = document.createElement('div');
                inputDiv.className = 'inline-editor';
                inputDiv.style.position = 'absolute';

                input = document.createElement('input');
                input.type = 'text';
                input.value = originalText;
                input.style.fontSize = window.getComputedStyle(element).fontSize;
                input.style.fontWeight = window.getComputedStyle(element).fontWeight;

                const tip = document.createElement('div');
                tip.className = 'editor-tip';
                tip.textContent = 'Enter确认 · Esc取消';

                inputDiv.appendChild(input);
                inputDiv.appendChild(tip);
                document.body.appendChild(inputDiv);

                const rect = element.getBoundingClientRect();
                inputDiv.style.left = (rect.left - 5) + 'px';
                inputDiv.style.top = (rect.top - 3) + 'px';
                inputDiv.style.minWidth = (rect.width + 10) + 'px';
                input.style.minWidth = (rect.width + 10) + 'px';
            }

            currentEditor = { element, inputDiv, input, key, originalText };

            input.focus();
            input.select();

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    finishEdit();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    cancelEdit();
                }
            });

            input.addEventListener('blur', function() {
                finishEdit();
            });
        }

        function finishEdit() {
            if (!currentEditor) return;

            const { element, inputDiv, input, key } = currentEditor;
            const newValue = input.value.trim();

            if (newValue !== element.textContent) {
                element.textContent = newValue;
                currentConfig[key] = newValue;
                saveConfig();
            }

            inputDiv.remove();
            currentEditor = null;
        }

        function cancelEdit() {
            if (!currentEditor) return;
            const { inputDiv } = currentEditor;
            inputDiv.remove();
            currentEditor = null;
        }

        function saveConfig() {
            localStorage.setItem('vsmConfig', JSON.stringify(currentConfig));
        }

        function resetAll() {
            if (confirm('确定要重置所有文字为默认值吗？')) {
                currentConfig = {...defaultConfig};
                localStorage.removeItem('vsmConfig');
                applyConfig();
            }
        }

        function exportConfig() {
            const jsonStr = JSON.stringify(currentConfig, null, 2);
            const blob = new Blob([jsonStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'vsm_config.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
